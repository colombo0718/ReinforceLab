          <div id="algo-selection">
            <h4>演算法選擇</h4>
            <!-- 學習方法選擇 -->
            <label>學習方式:</label><br>
            <input type="radio" id="algorithm-qtable" name="algorithm" value="Qtable" checked onchange="handleSelection()">
            <label for="algorithm-qtable">Q-Table</label>
            <input type="radio" id="algorithm-dqn" name="algorithm" value="DQN" onchange="handleSelection()">
            <label for="algorithm-dqn">DQN</label>
            <br><br>
            
            <!-- 探索策略選擇 -->
            <label>抉擇策略:</label><br>
            <input type="radio" id="strategy-egreedy" name="strategy" value="egreedy" checked onchange="handleStrategySelection()">

            <br>

            <label for="discount-factor-slider">回朔率 (γ):</label>
            <input id="discount-factor-slider" type="range" min="0" max="0.95" step="0.05" value="0.95"

            <span class="value-display" id="gamma-value">0.95</span>

            <div id="epsilon-row">
            <label for="exploration-rate-slider">探索率 (ε):</label>

            </div>

            <input id="optimism-slider" type="range" min="-1" max="1" step="0.1" value="1"
                  oninput="updateValue('Psi', this.value)">
            <span class="value-display" id="psi-value">1</span>
            <br><br>

            <label for="delay-slider">延遲量(ms):</label>

                  oninput="updateValue('delayTime', this.value)">
            <span class="value-display" id="delaytime-value">50</span>
          </div>
      <!-- 第一區：Cumulative Reward Chart -->
      
            <div id="p1-second-reward" class="chart"></div>  <!-- 左上 -->

  <!-- ================================ -->
  <!-- JS 區段：全屏切換、Tabs 控制、Q-Learning 主邏輯、DQN Worker 橋接 -->
  <!-- ================================ -->
  <script src="./agentVisualizer.js"></script>
  <script>

    /***************************************************
     * [1] 全屏 / 半屏 切換
     * 點擊後隱藏右側面板，讓遊戲 iframe 佔滿全寬
     ***************************************************/
    const leftPanel = document.getElementById("leftPanel");
    const rightPanel = document.getElementById("rightPanel");
    const fullscreenButton = document.getElementById("toggleFullscreen");

    fullscreenButton.addEventListener("click", () => {
      if (leftPanel.classList.contains("fullscreen")) {
        leftPanel.classList.remove("fullscreen");
        rightPanel.style.display = "flex";
        fullscreenButton.textContent = "🕹️全屏";
      } else {
        leftPanel.classList.add("fullscreen");
        rightPanel.style.display = "none";
        fullscreenButton.textContent = "🧪半屏";
      }
    });


    /***************************************************
     * [2] 遊戲控制：載入 / 暫停 / 加速
     *
     * loadGame(url)
     *   遞增 currentSessionId（讓舊訊息被過濾），設定 iframe src，重置暫停狀態
     *
     * togglePause
     *   送 pause toggle 給遊戲；繼續時補送 action:0 讓遊戲重啟訊息循環
     *
     * toggleAccel
     *   送 accel toggle 給遊戲；同步縮短 / 還原本地 delayTime
     ***************************************************/
    const loadGameBtn    = document.getElementById("loadGame");
    const gameUrlInput   = document.getElementById("gameUrlInput");
    const gameIframe     = document.getElementById("game-iframe");
    const togglePauseBtn = document.getElementById("togglePause");
    const toggleAccelBtn = document.getElementById("toggleAccel");

    let currentSessionId = 1;

    // 主動取消任何掛住的 requestFit() Promise，不等 Worker 回應
    // 必須在 loadGame() 最先執行，切斷迴圈對 Worker 的依賴
    function cancelPendingFit() {
      if (pendingFitResolve) {
        pendingFitResolve(null);
        pendingFitResolve = null;
      }
      fitInProgress = false;
      document.getElementById('stat-sync').textContent = '神經網路建立中';
    }

    function loadGame(url) {
      cancelPendingFit();                                      // 主動解開任何 pending requestFit()
      currentSessionId += 1;
      console.log(currentSessionId);
      gameUrlInput.value = url;
      gameIframe.src = url;
      isPaused = false;
      togglePauseBtn.textContent = "⏸️暫停";
      resetGeneralCharts();                                    // 刷新四張通用圖表
      dqnWorker.postMessage({ type: 'resetQTable' });          // 清空 Worker 的 Q-Table 副本
      dqnFitted     = false;                                   // 重置 DQN 信任旗標
      window.rrLog.game     = url;
      window.rrLog.params   = { alpha: Alpha, gamma: Gamma, epsilon: Epsilon, bins: numBins };
      window.rrLog.episodes = [];
    }

    loadGameBtn.addEventListener("click", () => {
      loadGame(gameUrlInput.value.trim());
    });

    let isPaused = false;
    togglePauseBtn.addEventListener("click", () => {
      if (!isPaused) {
        gameIframe.contentWindow.postMessage({ type: "pause" }, "*");
        togglePauseBtn.textContent = "▶️繼續";
        runPausedDistillation(); // 暫停時讓 NN 繼續向 Q-Table 學習
      } else {
        gameIframe.contentWindow.postMessage({ type: "pause" }, "*");
        gameIframe.contentWindow.postMessage({ type: "action", action: 0 }, "*");
        togglePauseBtn.textContent = "⏸️暫停";
        // isPaused = false 後，runPausedDistillation 的 while 迴圈自然退出
      }
      isPaused = !isPaused;
    });

    // 暫停期間自動蒸餾：讓 NN 持續向 Q-Table 學習，直到遊戲恢復
    async function runPausedDistillation() {
      while (isPaused) {
        if (!fitInProgress) {
          fitInProgress = true;
          syncQTableToWorker();
          await requestFit(); // fitDone handler 會重置 fitInProgress
        } else {
          await new Promise(r => setTimeout(r, 200)); // 等前一次 fit 結束
        }
      }
    }

    let isAccel = false;
    toggleAccelBtn.addEventListener("click", () => {
      if (!isAccel) {
        gameIframe.contentWindow.postMessage({ type: "accel" }, "*");
        toggleAccelBtn.textContent = "🐇正常";
        delayTime = basicDelayTime / 5;
      } else {
        gameIframe.contentWindow.postMessage({ type: "accel" }, "*");
        toggleAccelBtn.textContent = "🚀加速";
        delayTime = basicDelayTime;
      }
      isAccel = !isAccel;
    });

    // 動作按鈕高亮（highlight 當前動作對應的按鈕）
    function setActiveActionButton(actionIndex) {
      const btns = document.querySelectorAll("#actions button");
      for (const b of btns) b.classList.remove("flash");
      if (btns[actionIndex]) btns[actionIndex].classList.add("flash");
    }


    /***************************************************
     * [3] Tabs 切換
     * 點擊 sub-tab-link 切換對應的 sub-tab-content
     * Blockly 面板需要在顯示時觸發 svgResize 才能正確渲染
     ***************************************************/
    const subTabLinks    = document.querySelectorAll(".sub-tab-link");
    const subTabContents = document.querySelectorAll(".sub-tab-content");

    subTabLinks.forEach(link => {
      link.addEventListener("click", () => {
        subTabLinks.forEach(l => l.classList.remove("active"));
        subTabContents.forEach(c => c.classList.remove("active"));
        link.classList.add("active");
        const target = link.getAttribute("data-subtab");
        document.getElementById(target).classList.add("active");
        if (target === "p1-blocks" && workspace1) Blockly.svgResize(workspace1);
        if (target === "p2-blocks" && workspace2) Blockly.svgResize(workspace2);
        if (window.Plotly) {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            document.querySelectorAll(`#${target} .chart`).forEach(el => {
              if (el.id) Plotly.Plots.resize(el.id);
            });
          }));
        }
      });
    });

    // 遊戲清單的「快速載入」按鈕（動態注入到 gamelist.html，用事件代理捕捉）
    document.addEventListener('click', function(e) {
      const button = e.target.closest('.quick-load-button');
      if (!button) return;
      loadGame(button.getAttribute('data-url'));
    });


    /***************************************************
     * [4] 文件動態載入
     * docs/ 下三個頁面用 fetch 注入到對應的空 div
     * 注意：gamelist.html 不是獨立頁面，只是 HTML 片段
     ***************************************************/
    let plotGeneralCharts = true;
    let plotQualityCharts = true;

    function loadDoc(target, file) {
      fetch(file)
        .then(res => res.text())
        .then(html => { document.getElementById(target).innerHTML = html; });
    }

    loadDoc("tutorial",       "./pages/tutorial.html");
    loadDoc("offical-games",  "./pages/gamelist.html");
    loadDoc("privacy-policy", "./pages/about.html");


    /***************************************************
     * [5] 演算法與策略選擇
     *
     * currentAlgorithm：'Qtable' | 'DQN'
     *   控制 evaluateQuality() 的行為：
     *     Qtable → 查 Q-Table（同步）
     *     DQN    → 向 Worker 發 predict（非同步，待實作）
     *   同時控制 qTableUpdate() 的 Bellman max Q(s') 來源
     *
     * currentStrategy：'egreedy' | 'softmax'
     *   控制 planningStrategy() 使用哪種探索策略
     *
     * handleSelection() / handleStrategySelection() 由 HTML radio onchange 呼叫
     ***************************************************/
    let currentAlgorithm = 'Qtable';
    let currentStrategy  = 'egreedy';

    function handleSelection() {
      currentAlgorithm = document.querySelector('input[name="algorithm"]:checked').value;
    }

    function handleStrategySelection() {
      currentStrategy = document.querySelector('input[name="strategy"]:checked').value;
      const isEgreedy = currentStrategy === 'egreedy';
      document.getElementById('epsilon-row').style.opacity = isEgreedy ? '1' : '0.4';
      document.getElementById('exploration-rate-slider').disabled = !isEgreedy;
      document.getElementById('tau-row').style.opacity    = isEgreedy ? '0.4' : '1';
      document.getElementById('temperature-slider').disabled = isEgreedy;
    }


    /***************************************************
     * [6] 超參數全局變數與 UI 同步
     *
     * Alpha：學習率（Bellman 更新步長）
     * Gamma：折扣因子（未來獎勵的衰減率）
     * Epsilon：探索率（ε-greedy 中隨機探索的比例）
     * Tau：溫度參數（Softmax 中控制動作機率分散程度，τ↑→越均等，τ↓→越貪婪）
     * Psi：樂觀初始化值（控制 targetQ 在 max/actual/min 之間的混合）
     * basicDelayTime：滑桿設定的基礎延遲（ms）
     * delayTime：實際使用的延遲，加速模式下為 basicDelayTime/5
     *
     * updateValue() 由各滑桿的 oninput 呼叫，同步更新變數與顯示 span
     ***************************************************/
    let QTable  = {};
    let Alpha   = 0.5;
    let Gamma   = 0.95;
    let Epsilon = 0.1;
    let Tau     = 5.0;
    let Psi     = 1;

    let basicDelayTime = 50, delayTime = 50;

    function updateValue(parameter, value) {
      value = parseFloat(value);
      switch (parameter) {
        case "Alpha":     Alpha = value; break;
        case "Gamma":     Gamma = value; break;
        case "Epsilon":   Epsilon = value; break;
        case "Tau":       Tau = value; document.getElementById('tau-value').textContent = value.toFixed(1); break;
        case "Psi":       Psi = value; break;
        case "delayTime":
          basicDelayTime = value;
          // 同步更新實際延遲（加速模式下也要跟著變）
          delayTime = isAccel ? basicDelayTime / 5 : basicDelayTime;
          break;
        default: console.warn(`未知參數: ${parameter}`);
      }
      const targetSpan = document.getElementById(parameter.toLowerCase() + "-value");
      if (targetSpan) targetSpan.textContent = value;
      console.log(`${parameter} 更新為 ${value}`);
    }


    /***************************************************
     * [7] postMessage 通訊 Part A：gameInfo（遊戲初始化）
     *
     * 流程：
     *   iframe load → 送 questInfo（帶 currentSessionId）
     *   → 遊戲回傳 gameInfo → 解析 stateInfo / actionInfo
     *   → 重置 QTable + stateRange + numBins
     *   → 同步給 Worker（syncStateInfoToWorker）
     *   → 送 action:0 讓遊戲進入第一步
     *
     * 注意：此 addEventListener 與主訓練迴圈（[11]）是兩個獨立的 message 監聽，
     *       各自只處理自己關心的 type，互不影響
     ***************************************************/
    let stateInfo;
    let actionInfo;
    let state_size;
    let action_size;

    gameIframe.addEventListener("load", () => {
      gameIframe.contentWindow.postMessage({ type: "questInfo", sessionId: currentSessionId }, "*");
    });

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message.type !== "gameInfo") return;

      console.log(message);
      stateInfo   = message.players[0].stateInfo;
      actionInfo  = message.players[0].actionInfo;
      state_size  = stateInfo.length;
      action_size = actionInfo[0].level;
      console.log(stateInfo, actionInfo);

      // 重新生成動作 UI 按鈕
      const actionsDiv = document.getElementById("actions");
      const names = actionInfo?.[0]?.name || [];
      actionsDiv.innerHTML = "";
      for (let i = 0; i < names.length; i++) {
        const btn = document.createElement("button");
        btn.textContent = names[i];
        actionsDiv.appendChild(btn);
      }
      renderActionColorWheel(actionInfo);

      // 重置 Q-Table 與狀態離散化設定
      QTable     = {};
      stateRange = [];
      numBins    = [];
      stateInfo.forEach((info) => {
        stateRange.push({ min: info.min, max: info.max });
        numBins.push(info.bin ?? 10); // 遊戲未宣告 bin 時預設 10 桶
      });

      syncStateInfoToWorker();
      dqnWorker.postMessage({ type: 'initModel', stateDim: stateInfo.length, actionCount: action_size });
      initChartControls(); // 更新分析頁的維度選單與滑桿範圍
      gameIframe.contentWindow.postMessage({ type: "action", action: 0 }, "*");
    });


    /***************************************************
     * [8] 演算法管線：評估 → 策略 → 動作
     *
     * evaluateQuality(state) → qArray（各動作的估值）
     *   Q-Table 模式：同步查表（getQArrayFromTable）
     *   DQN 模式：非同步 Worker predict（dqnFitted 前仍走 Q-Table 作為暖機）
     *
     * planningStrategy(qArray) → strategy（各動作的機率分配）
     *   根據 currentStrategy 分流 ε-greedy 或 Softmax
     *
     * learnOneStep() — 單步 Q-Table Bellman 更新
     *   由主迴圈（零 reward 時）或 learnFromTrace 呼叫
     ***************************************************/
    let prevAction, prevState;
    let nextAction, nextState;
    let reward;

    async function evaluateQuality(State) {
      // DQN 模式：透過 Worker predict 取估值（非同步）
      // dqnFitted 確保第一次訓練前不使用垃圾估值
      if (currentAlgorithm === 'DQN' && dqnFitted) {
        return new Promise((resolve) => {
          pendingPredictResolve = resolve;
          dqnWorker.postMessage({ type: 'predict', data: State });
        });
      }
      return getQArrayFromTable(State);
    }

    function planningStrategy(qArray) {
      if (currentStrategy === 'softmax') return softmaxStrategy(qArray);
      return eGreedyStrategy(qArray); // 預設 ε-greedy
    }

    function learnOneStep(prevState, prevAction, reward, nextState, nextAction, nextQArray = null) {
      if (Number.isInteger(prevAction)) {
        qTableUpdate(prevState, prevAction, reward, nextState, nextAction, nextQArray);
      }
    }


    /***************************************************
     * [9] Trace 機制（回溯更新）
     *
     * 每步把 (s, a, r, s', a') 推入 trace 頭部，最多保留 traceLength 筆
     * 收到非零 reward 時，對整段 trace 做等權回溯更新
     *
     * 設計動機：標準 Q-Learning 每局只往前推一步，稀疏 reward 傳播極慢
     * 類似 TD(λ) 的 Eligibility Trace，固定 N=5 步、等權，更簡單直觀
     * DQN 有空間擴散（內插泛化）但沒有時間回溯，兩者互補
     ***************************************************/
    const traceLength = 5;
    let trace = [];

    function recordStep(prevState, prevAction, reward, nextState, nextAction, nextQArray = null) {
      trace.unshift([prevState, prevAction, reward, nextState, nextAction, nextQArray]);
      if (trace.length > traceLength) trace.pop();
    }

    function learnFromTrace() {
      for (let i = 0; i < trace.length; i++) {
        const [prevState, prevAction, reward, nextState, nextAction, nextQArray] = trace[i];
        learnOneStep(prevState, prevAction, reward, nextState, nextAction, nextQArray);
      }
    }


    /***************************************************
     * [10] DQN Web Worker 橋接
     *
     * Worker（dqnWebWorker.js）在獨立執行緒中持有 Q-Table 副本，
     * 定期 fit 神經網路（Q-Table 蒸餾），並回應 predict 請求
     *
     * syncQTableToWorker()    — 把主執行緒 QTable 的變動增量同步給 Worker
     * syncStateInfoToWorker() — 遊戲初始化後同步 stateRange / numBins
     * pendingPredictResolve   — DQN 模式下等待 predictResult 的 Promise resolve 暫存
     *
     * Worker 訊息協定（完整規格見「Q表蒸餾式DQN：實作規格.md」）：
     *   主→Worker：updateQTable / updateStateInfo / fit / predict / batchPredict / resetQTable / initModel
     *   Worker→主：log / ready / predictResult / fitDone / batchPredictResult
     ***************************************************/
    const dqnWorker = new Worker('dqnWebWorker.js');

    let dqnFitted             = false;  // 第一次 fit 成功前不讓 DQN 估值污染 Q-Table
    let pendingPredictResolve = null;   // DQN predict Promise 暫存
    let pendingFitResolve     = null;   // DQN fit   Promise 暫存
    let fitInProgress         = false;  // 防止 Q-Table 模式下 fire-and-forget fit 重疊
    let chartDataSource       = 'qtable'; // 圖表繪製資料來源（'qtable' | 'dqn'）
    let dqnPreviewTable       = {};     // DQN 對各 Q-Table 格子的批量預測快取

    // 全量同步 QTable → Worker（陣列比較參考相等性，增量 diff 無意義）
    function syncQTableToWorker() {
      dqnWorker.postMessage({ type: 'updateQTable', data: { ...QTable } });
    }

    function syncStateInfoToWorker() {
      dqnWorker.postMessage({ type: 'updateStateInfo', data: { stateRange, numBins } });
    }

    // 等待 Worker 完成一次蒸餾訓練（回傳 Promise，resolve 在 fitDone 訊息觸發）
    function requestFit() {
      return new Promise((resolve) => {
        pendingFitResolve = resolve;
        dqnWorker.postMessage({ type: 'fit' });
      });
    }

    // 請 Worker 對所有已知 Q-Table 格子做一次批量推論，刷新 dqnPreviewTable
    function requestBatchPredict() {
      if (!dqnFitted) return;
      dqnWorker.postMessage({ type: 'batchPredict', keys: Object.keys(QTable) });
    }

    // 圖表資料來源切換（由 HTML radio onchange 呼叫）
    function handleChartSourceSelection() {
      chartDataSource = document.querySelector('input[name="chart-source"]:checked')?.value ?? 'qtable';
      if (chartDataSource === 'dqn') requestBatchPredict(); // 立即刷新一次
    }

    // 供 qualityCharts.js 呼叫：根據 chartDataSource 決定用哪張表
    function getQArrayForChart(state) {
      if (chartDataSource === 'dqn' && dqnFitted) {
        const key = getStateKey(state);
        return dqnPreviewTable[key] ?? Array(action_size).fill(0);
      }
      return getQArrayFromTable(state);
    }

    dqnWorker.onmessage = (event) => {
      if (event.data.type === 'log') {
        console.log("[Worker Log]:", event.data.message);
      } else if (event.data.type === 'predictResult') {
        if (pendingPredictResolve) {
          pendingPredictResolve(event.data.qValues);
          pendingPredictResolve = null;
        }
      } else if (event.data.type === 'fitDone') {
        dqnFitted     = true;                                  // 第一次 fit 後開始信任 DQN
        fitInProgress = false;                                 // 解鎖 fire-and-forget
        const loss = event.data.loss;
        const syncRate = event.data.syncRate;
        console.log(`[DQN] fit 完成，loss=${loss?.toFixed(4)}`);
        if (syncRate != null) {
          document.getElementById('stat-sync').textContent = `${(syncRate * 100).toFixed(1)}%`;
        }
        if (pendingFitResolve) {
          pendingFitResolve(loss);
          pendingFitResolve = null;
        }
        if (chartDataSource === 'dqn') requestBatchPredict(); // 每次 fit 後自動刷新預覽
      } else if (event.data.type === 'batchPredictResult') {
        dqnPreviewTable = event.data.results;                  // 整張表一次更新
      }
    };

    dqnWorker.onerror = (error) => {
      console.error("Web Worker 錯誤:", error);
    };

    // Qt 模式專用：持續背景蒸餾迴圈，不受遊戲暫停影響
    // DQN 模式的 fit 在 episode 結束時 await 觸發，不走這裡
    async function runQtDistillationLoop() {
      while (true) {
        if (currentAlgorithm !== 'DQN' && !fitInProgress && Object.keys(QTable).length > 0) {
          fitInProgress = true;
          syncQTableToWorker();
          await requestFit();
        } else {
          await new Promise(r => setTimeout(r, 200));
        }
      }
    }
    runQtDistillationLoop();


    /***************************************************
     * [11] postMessage 通訊 Part B：reward_state 主訓練迴圈
     *
     * 每步流程（收到 reward_state 後）：
     *   0. sessionId 驗證（過濾換遊戲後的舊訊息）
     *   1. evaluateQuality(nextState) → qArray
     *   2. planningStrategy(qArray) → strategy → selectAction → nextAction
     *   3. recordStep；reward≠0 → learnFromTrace；否則 learnOneStep（單步更新）
     *   4. updateQtableStats（更新分析面板）
     *   5. done:true → 更新回合圖表，重置計數；DQN 模式 → syncQTable → await fit
     *   6. setTimeout(送 action，delayTime ms)
     *
     * 同一個 listener 也處理：
     *   frame      — 統計幀數（目前未使用）
     *   endEpisode — 舊協定相容，新遊戲改用 done:true，此分支保留但不依賴
     ***************************************************/
    let frameNumber = 0;

    window.addEventListener("message", async (event) => {
      const message = event.data;

      if (message.type === "reward_state") {

        // 過濾過期的 sessionId（換遊戲後舊訊息不處理）
        if (!message.sessionId) return;
        if (message.sessionId !== currentSessionId) return;

        reward    = message.reward;
        nextState = message.state;

        secondReward  += reward;
        secondSteps   += 1;
        episodeReward += reward;
        episodeSteps  += 1;
        window.rrStepCount = (window.rrStepCount ?? 0) + 1;

        // 演算法管線
        let qArray   = await evaluateQuality(nextState);  // 1. 評估價值（DQN 模式為非同步）
        let strategy = planningStrategy(qArray);          // 2. 擬定策略
        nextAction   = selectAction(strategy);            // 3. 選擇動作

        // 學習（qArray 傳入，DQN 模式下 qTableUpdate 可用 DQN 估值做 Bellman target）
        recordStep(prevState, prevAction, reward, nextState, nextAction, qArray);
        if (reward !== 0) {
          learnFromTrace();   // 非零 reward：整段 trace 回溯更新
        } else {
          learnOneStep(prevState, prevAction, reward, nextState, nextAction, qArray);
        }

        updateQtableStats();

        prevState  = nextState;
        prevAction = nextAction;
        frameNumber = 0;

        // 回合結束
        if (message.done === true) {
          if (plotGeneralCharts) updateEpisodeChart();
          window.rrLog.episodes.push({ ep: episodeCount, reward: episodeReward, steps: episodeSteps });
          window.rrLog.params = { alpha: Alpha, gamma: Gamma, epsilon: Epsilon, bins: numBins };
          episodeCount  += 1;
          episodeReward  = 0;
          episodeSteps   = 0;

          // 回合結束：DQN 模式需 await fit（下一局動作需要 DQN 估值）
          // Qt 模式由 runQtDistillationLoop 背景持續處理，此處不再觸發
          if (currentAlgorithm === 'DQN') {
            syncQTableToWorker();
            fitInProgress = true;
            await requestFit();
          }
        }

        // 送出下一步動作
        if (isPaused) return;
        setTimeout(() => {
          gameIframe.contentWindow.postMessage({ type: "action", action: nextAction }, "*");
          setActiveActionButton(nextAction);
        }, delayTime);
      }

      if (message.type === "frame") {
        frameNumber += 1;
      }

      // 舊協定相容（新遊戲應使用 done:true，不應再依賴此分支）
      if (message.type === "endEpisode") {
        console.log('endEpisode');
        if (plotGeneralCharts) updateEpisodeChart();
        episodeCount  += 1;
        episodeReward  = 0;
        episodeSteps   = 0;
      }
    });


    /***************************************************
     * [12] 圖表全局變數
     * 供 generalCharts.js 的 updateSecondChart / updateEpisodeChart 消費
     *
     * secondReward / secondSteps：每步由主迴圈累加，每秒圖表更新後歸零
     * episodeReward / episodeSteps：每步累加，done:true 後歸零
     * episodeCount：每回合結束 +1，不歸零（作為 x 軸編號）
     ***************************************************/
    let secondReward = 0;
    let secondSteps  = 0;

    let rewardData   = [];
    let rewardLabels = [];
    let stepsData    = [];
    let stepsLabels  = [];

    let startTime = Date.now();

    let episodeIndex      = [];
    let episodeRewardData = [];
    let episodeStepsData  = [];

    let episodeCount  = 1;
    let episodeReward = 0;
    let episodeSteps  = 0;

    // Experiment log — readable by Playwright via page.evaluate(() => window.rrLog)
    window.rrLog = {
      game:     null,
      params:   {},
      episodes: []
    };
    window.rrLogSnapshot = () => ({
      game:     window.rrLog.game,
      params:   { ...window.rrLog.params },
      episodes: window.rrLog.episodes.slice()
    });


    /***************************************************
     * [13] QTable Export / Import
     * exportQtable() — 序列化為 JSON 下載
     * importQtable() — 從 JSON 檔案還原，可銜接繼續訓練
     ***************************************************/
    function exportQtable() {
      const dataStr = JSON.stringify(QTable, null, 2);
      const blob    = new Blob([dataStr], { type: "application/json" });
      const url     = URL.createObjectURL(blob);
      const link    = document.createElement("a");
      link.href     = url;
      link.download = "Qtable.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function clearQtable() {
      QTable = {};
      dqnFitted     = false;
      fitInProgress = false;
      dqnPreviewTable = {};
      dqnWorker.postMessage({ type: 'resetQTable' });
      dqnWorker.postMessage({ type: 'initModel', stateDim: stateInfo?.length ?? 1, actionCount: action_size ?? 1 });
      document.getElementById('stat-sync').textContent = '神經網路建立中';
      updateQtableStats();
    }

    function importQtable(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          QTable = JSON.parse(e.target.result);
          dqnFitted     = false;
          fitInProgress = false;
          dqnPreviewTable = {};
          document.getElementById('stat-sync').textContent = '神經網路建立中';
          syncQTableToWorker();   // 讓 Worker 副本與載入的 QTable 一致
          updateQtableStats();
          console.log("QTable imported successfully:", Object.keys(QTable).length, "entries");
        } catch (error) {
          console.error("Error parsing QTable file", error);
        }
      };
      reader.readAsText(file, "utf-8");
      // 清空 input value，讓同一個檔案下次仍能觸發 onchange
      evt.target.value = '';
    }


    /***************************************************
     * [14] QTable 統計面板更新
     * 計算並顯示：狀態池化尺寸、動作數、已探索格數 / 總格數、覆蓋率
     *
     * ⚠ 潛在問題：依賴 stateInfo[x].bin 存在
     *   若遊戲未宣告 bin，stateBins 會含 undefined，導致乘積計算出 NaN
     *   （numBins 已補預設值 20，但 stateInfo 原始物件不受影響）
     ***************************************************/
    function updateQtableStats() {
      const stateBins       = stateInfo.map(s => s.bin);
      const totalStates     = stateBins.reduce((a, b) => a * b, 1);
      const actionLevels    = actionInfo.map(a => a.level);
      const actionsPerState = actionLevels.reduce((a, b) => a * b, 1);
      const totalCells      = totalStates * actionsPerState;

      let visitedCells = 0;
      for (const stateKey in QTable) {
        for (const q of QTable[stateKey]) {
          if (Math.abs(q) > 0) visitedCells++;
        }
      }

      const coverage = (visitedCells / totalCells * 100).toFixed(1);

      document.getElementById("stat-bins").textContent    = `[${stateBins.join("×")}]`;
      document.getElementById("stat-actions").textContent = `[${actionLevels.join(",")}]`;
      document.getElementById("stat-total").textContent   = `${visitedCells} / ${totalCells}`;
      document.getElementById("stat-cover").textContent   = `${coverage}%`;
    }

    // ── ?game= URL 參數自動載入 ────────────────────────────────────────────────
    (function () {
      const params   = new URLSearchParams(window.location.search);
      const gameParam = params.get("game");
      if (gameParam) loadGame(gameParam);
    })();

  </script>
  <script>window.chartLang = window.chartLang ?? "en";</script>
  <script src="./generalCharts.js"></script>
  <script src="./qualityCharts.js"></script>
  <script src="./reinforceEngine.js"></script>

  <script>
    // 豎屏模式：強制切換到儀錶 tab
    const PORTRAIT_HIDDEN_TABS = ['tutorial', 'privacy-policy', 'p1-qtable', 'offical-games'];
    function handlePortraitTabSwitch() {
      if (!window.matchMedia('(orientation: portrait)').matches) return;
      const active = document.querySelector('.sub-tab-content.active');
      if (!active || PORTRAIT_HIDDEN_TABS.includes(active.id)) {
        document.querySelector('.sub-tab-link[data-subtab="p1-config"]')?.click();
      }
      if (window.Plotly) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          document.querySelectorAll('#p1-config .chart').forEach(el => {
            const w = el.offsetWidth;
            if (el.id && w > 0) Plotly.relayout(el.id, { width: w });
          });
        }));
      }
    }
    window.addEventListener('orientationchange', handlePortraitTabSwitch);
    window.addEventListener('resize', handlePortraitTabSwitch);
    handlePortraitTabSwitch();
  </script>
